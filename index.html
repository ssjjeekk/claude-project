<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코끼리 별 받기</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #1b1640;
    color: #fff;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  button { font-family: inherit; touch-action: manipulation; }
  .hidden { display: none !important; }

  /* ---------- 게임 화면 배치 ---------- */
  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 520px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
    gap: 8px;
  }
  #hud {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .stat { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  .label { font-size: 13px; font-weight: 700; color: #cfc8ff; white-space: nowrap; }
  .big { font-size: 32px; font-weight: 900; color: #ffe066; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big small { font-size: 16px; color: #cfc8ff; font-weight: 700; }
  #hearts { display: block; width: 126px; height: 24px; margin-top: 4px; }
  #musicBtn {
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #musicBtn[aria-pressed="false"] { opacity: 0.7; }
  #musicBtn:disabled { opacity: 0.45; cursor: default; }

  #stage {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    border-radius: 14px;
    background: #2a2366;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    touch-action: none;
    cursor: grab;
  }

  #controls { flex: 0 0 auto; display: flex; gap: 10px; }
  .move {
    flex: 1 1 0;
    min-width: 0;
    height: 72px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    touch-action: none;
    cursor: pointer;
  }
  .move.on { background: rgba(255, 224, 102, 0.35); border-color: #ffe066; transform: scale(0.97); }
  .arrow { width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; }
  .arrow.l { border-right: 20px solid currentColor; }
  .arrow.r { border-left: 20px solid currentColor; }

  /* ---------- 덮는 화면들 ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
    text-align: center;
  }
  .inner {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
  }
  #startScreen { background: radial-gradient(circle at 50% 30%, #4b3a9a, #1b1640 72%); }
  #poster {
    display: block;
    max-width: min(100%, 480px);
    max-height: calc(100vh - 210px);
    max-height: calc(100dvh - 210px);
    width: auto;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  #posterCanvas {
    display: block;
    width: min(82vw, 320px, calc(100dvh - 230px));
    aspect-ratio: 1;
    border-radius: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .hint { margin: 0; font-size: 16px; color: #e4defa; line-height: 1.5; }
  .hint.small { font-size: 13px; color: #b9b0e6; }

  .btn {
    font-size: 24px;
    font-weight: 900;
    color: #3a2600;
    background: linear-gradient(#ffe680, #ffc233);
    border: 0;
    border-radius: 999px;
    padding: 14px 48px;
    box-shadow: 0 5px 0 #c98a00, 0 10px 20px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c98a00, 0 6px 14px rgba(0, 0, 0, 0.3); }

  #overScreen { z-index: 25; background: rgba(15, 10, 40, 0.72); }
  .panel {
    background: rgba(36, 27, 92, 0.94);
    border: 2px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    padding: 24px 28px;
    width: min(340px, 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .panel h2 { margin: 0; font-size: 34px; font-weight: 900; }
  .panel p { margin: 0; font-size: 18px; color: #e4defa; }
  #overScreen h2 { color: #ff8da1; }
  #endPanel h2 { color: #ffe066; }

  #endingScreen { z-index: 30; background: #000; }
  #endingScreen.novideo { background: radial-gradient(circle at 50% 35%, #5a45b0, #1b1640 75%); }
  #endingVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #endPanel { position: relative; }
  #skipBtn {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top));
    right: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat">
      <span class="label">점수 · <span id="progress">별 0 / 10</span></span>
      <span class="big"><span id="score">0</span><small> / 300</small></span>
    </div>
    <div class="stat">
      <span class="label">목숨</span>
      <canvas id="hearts" role="img" aria-label="목숨 5개"></canvas>
    </div>
    <button id="musicBtn" type="button" aria-pressed="true">음악 끄기</button>
  </div>

  <div id="stage">
    <canvas id="game" aria-label="게임 화면. 끌어서 코끼리를 움직여요"></canvas>
  </div>

  <div id="controls">
    <button id="leftBtn" class="move" type="button" aria-label="왼쪽으로"><span class="arrow l"></span>왼쪽</button>
    <button id="rightBtn" class="move" type="button" aria-label="오른쪽으로">오른쪽<span class="arrow r"></span></button>
  </div>
</div>

<!-- 시작 화면 -->
<div id="startScreen" class="overlay">
  <div class="inner">
    <img id="poster" src="poster.png" alt="">
    <canvas id="posterCanvas" class="hidden" aria-label="코끼리 별 받기"></canvas>
    <p class="hint">별 10개를 받으면 클리어! 선인장은 피해요.</p>
    <button id="startBtn" class="btn" type="button">시작</button>
    <p class="hint small">← → 키 · 아래 버튼 · 화면을 끌어서 움직여요</p>
  </div>
</div>

<!-- 게임 오버 -->
<div id="overScreen" class="overlay hidden">
  <div class="inner">
    <div class="panel">
      <h2>게임 오버</h2>
      <p id="overText">점수 0점</p>
      <button id="retryBtn" class="btn" type="button">다시 하기</button>
    </div>
  </div>
</div>

<!-- 클리어 엔딩 -->
<div id="endingScreen" class="overlay hidden">
  <video id="endingVideo" src="ending.mp4" playsinline webkit-playsinline preload="auto"></video>
  <button id="skipBtn" type="button" class="hidden">건너뛰기</button>
  <div class="inner">
    <div id="endPanel" class="panel hidden">
      <h2>클리어!</h2>
      <p>별 10개를 모두 받았어요 · 300점</p>
      <button id="againBtn" class="btn" type="button">다시 하기</button>
    </div>
  </div>
</div>

<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script>
(() => {
  'use strict';

  // ---------- 설정 ----------
  const W = 360, H = 540;            // 게임 세계 크기(화면에 맞게 늘이고 줄임)
  const GROUND = H - 26;             // 땅 높이
  const STAR_POINTS = 30;
  const GOAL = 300;
  const STARS_TO_CLEAR = GOAL / STAR_POINTS;
  const MAX_LIVES = 5;
  const INVINCIBLE = 1.5;            // 부딪힌 뒤 무적 시간(초)
  const SPEED = 330;                 // 키보드·버튼 이동 속도
  const CATCH_PAD = 22;              // 별 받기 판정 여유(좌우)

  const $ = id => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const stage = $('stage');
  const heartsCanvas = $('hearts');
  const hctx = heartsCanvas.getContext('2d');
  const scoreEl = $('score');
  const progressEl = $('progress');
  const musicBtn = $('musicBtn');
  const music = $('music');
  const poster = $('poster');
  const posterCanvas = $('posterCanvas');
  const startScreen = $('startScreen');
  const overScreen = $('overScreen');
  const endingScreen = $('endingScreen');
  const video = $('endingVideo');
  const endPanel = $('endPanel');
  const skipBtn = $('skipBtn');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- 상태 ----------
  // start → playing → (clearing → ending) 또는 (dying → over)
  let state = 'start';
  let score, lives, caught, invTimer, spawnTimer, sinceCactus, items, effects, waitTimer, shake, hitFlash;
  let time = 0;
  const player = { x: W / 2, w: 78, h: 62, face: 1, moving: false };
  const input = { keyL: false, keyR: false, btnL: false, btnR: false, drag: false, dragX: W / 2 };

  function reset() {
    score = 0;
    lives = MAX_LIVES;
    caught = 0;
    invTimer = 0;
    spawnTimer = 0.5;
    sinceCactus = 0;
    items = [];
    effects = [];
    waitTimer = 0;
    shake = 0;
    hitFlash = 0;
    player.x = W / 2;
    player.face = 1;
    input.drag = false;
    updateHud();
  }

  // ---------- 화면 크기 맞추기 ----------
  let sx = 1, sy = 1;
  function fit() {
    const r = stage.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return;
    let cw = r.width, ch = cw * H / W;
    if (ch > r.height) { ch = r.height; cw = ch * W / H; }
    cw = Math.floor(cw); ch = Math.floor(ch);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    sx = canvas.width / W;
    sy = canvas.height / H;
  }
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  fit();

  // ---------- 점수·목숨 표시 ----------
  function updateHud() {
    scoreEl.textContent = score;
    progressEl.textContent = '별 ' + caught + ' / ' + STARS_TO_CLEAR;
    heartsCanvas.setAttribute('aria-label', '목숨 ' + lives + '개');
    drawHearts();
  }

  function heartPath(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.9);
    c.bezierCurveTo(x - s * 1.35, y + s * 0.05, x - s * 0.95, y - s * 1.05, x, y - s * 0.4);
    c.bezierCurveTo(x + s * 0.95, y - s * 1.05, x + s * 1.35, y + s * 0.05, x, y + s * 0.9);
    c.closePath();
  }

  function drawHearts() {
    const cw = 126, ch = 24;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (heartsCanvas.width !== cw * dpr) {
      heartsCanvas.width = cw * dpr;
      heartsCanvas.height = ch * dpr;
    }
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    hctx.clearRect(0, 0, cw, ch);
    for (let i = 0; i < MAX_LIVES; i++) {
      heartPath(hctx, 11 + i * 26, 13, 10);
      if (i < lives) {
        hctx.fillStyle = '#ff5d7a';
        hctx.fill();
        hctx.lineWidth = 1.5;
        hctx.strokeStyle = '#ffd0d9';
        hctx.stroke();
      } else {
        hctx.fillStyle = 'rgba(255,255,255,0.12)';
        hctx.fill();
        hctx.lineWidth = 1.5;
        hctx.strokeStyle = 'rgba(255,255,255,0.35)';
        hctx.stroke();
      }
    }
  }

  // ---------- 그리기 도구 ----------
  function roundRectPath(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function ellipse(c, x, y, rx, ry, rot) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  }

  // 코끼리: (x, y)가 발 가운데. face 1이면 오른쪽을 봐요.
  function drawElephant(c, x, y, s, face, t, moving) {
    const skin = '#a7b4d8', dark = '#8190bb', line = '#4b5683';
    const bob = moving ? Math.sin(t * 16) * 1.6 : Math.sin(t * 3) * 0.6;
    const step = moving ? Math.sin(t * 16) : 0;
    c.save();
    c.translate(x, y);
    c.scale(face * s, s);
    c.lineJoin = 'round';
    c.lineCap = 'round';

    // 그림자
    c.fillStyle = 'rgba(0,0,0,0.25)';
    ellipse(c, 0, 1, 40, 5);
    c.fill();

    // 꼬리
    c.strokeStyle = line;
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(-36, -36 + bob);
    c.quadraticCurveTo(-47, -31 + bob, -45, -21 + bob);
    c.stroke();
    c.fillStyle = line;
    ellipse(c, -45, -19 + bob, 2.6, 4);
    c.fill();

    const leg = (lx, lift, col) => {
      c.fillStyle = col;
      roundRectPath(c, lx, -21 - lift, 13, 21, 4);
      c.fill();
      c.lineWidth = 2;
      c.strokeStyle = line;
      c.stroke();
      c.fillStyle = '#eef1fb';
      ellipse(c, lx + 6.5, -2.5 - lift, 4.5, 2);
      c.fill();
    };
    // 먼 쪽 다리
    leg(-22, Math.max(0, -step) * 4, dark);
    leg(15, Math.max(0, step) * 4, dark);

    // 몸통
    c.fillStyle = skin;
    ellipse(c, -6, -33 + bob, 33, 22);
    c.fill();
    c.lineWidth = 2;
    c.strokeStyle = line;
    c.stroke();

    // 가까운 쪽 다리
    leg(-32, Math.max(0, step) * 4, skin);
    leg(4, Math.max(0, -step) * 4, skin);

    // 코(머리 뒤에서 시작해 위로 말림)
    const trunk = () => {
      c.beginPath();
      c.moveTo(32, -38 + bob);
      c.quadraticCurveTo(47, -28 + bob, 44, -15 + bob);
      c.quadraticCurveTo(42, -7 + bob, 49, -9 + bob);
    };
    c.strokeStyle = line;
    c.lineWidth = 12;
    trunk();
    c.stroke();
    c.strokeStyle = skin;
    c.lineWidth = 8;
    trunk();
    c.stroke();

    // 머리
    c.fillStyle = skin;
    ellipse(c, 22, -41 + bob, 18, 18);
    c.fill();
    c.lineWidth = 2;
    c.strokeStyle = line;
    c.stroke();

    // 귀(살랑살랑)
    const flap = Math.sin(t * 5) * 1.2;
    c.fillStyle = dark;
    ellipse(c, 9, -41 + bob, 13 + flap, 16, -0.2);
    c.fill();
    c.stroke();
    c.fillStyle = '#f4a7c3';
    ellipse(c, 9, -40 + bob, 8 + flap * 0.6, 10.5, -0.2);
    c.fill();

    // 눈과 볼
    c.fillStyle = '#232845';
    ellipse(c, 28, -47 + bob, 3, 3.4);
    c.fill();
    c.fillStyle = '#fff';
    ellipse(c, 29, -48.3 + bob, 1.1, 1.1);
    c.fill();
    c.fillStyle = 'rgba(255,130,165,0.55)';
    ellipse(c, 31, -37 + bob, 4, 3);
    c.fill();

    c.restore();
  }

  function drawStar(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * 0.48 : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
    c.shadowColor = 'rgba(255,220,90,0.9)';
    c.shadowBlur = 14;
    c.fillStyle = '#ffd84a';
    c.fill();
    c.shadowBlur = 0;
    c.lineJoin = 'round';
    c.lineWidth = 2;
    c.strokeStyle = '#fff4b8';
    c.stroke();
    c.restore();
  }

  // 화분에 담긴 선인장: (x, y)가 그림 가운데
  function drawCactus(c, x, y) {
    c.save();
    c.translate(x, y);
    c.lineCap = 'round';
    c.lineJoin = 'round';
    const parts = [
      [() => { c.beginPath(); c.moveTo(0, 10); c.lineTo(0, -20); }, 16],
      [() => { c.beginPath(); c.moveTo(-3, 0); c.lineTo(-12, 0); c.lineTo(-12, -11); }, 8],
      [() => { c.beginPath(); c.moveTo(3, -6); c.lineTo(12, -6); c.lineTo(12, -16); }, 8]
    ];
    // 테두리를 먼저 다 그린 뒤 속을 칠해서 겹친 선이 안 보이게
    parts.forEach(([p, w]) => { c.strokeStyle = '#1f6b35'; c.lineWidth = w + 4; p(); c.stroke(); });
    parts.forEach(([p, w]) => { c.strokeStyle = '#4cbc66'; c.lineWidth = w; p(); c.stroke(); });

    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(-3, 8); c.lineTo(-3, -22);
    c.moveTo(3, 8); c.lineTo(3, -22);
    c.stroke();

    // 가시
    c.strokeStyle = '#fbf7d8';
    c.lineWidth = 1.3;
    c.beginPath();
    [-18, -9, 0].forEach(yy => {
      c.moveTo(-8, yy); c.lineTo(-12, yy - 2);
      c.moveTo(8, yy + 4); c.lineTo(12, yy + 2);
    });
    c.moveTo(-16, -8); c.lineTo(-19, -10);
    c.moveTo(16, -13); c.lineTo(19, -15);
    c.stroke();

    // 꽃
    c.fillStyle = '#ff7eb6';
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5 - Math.PI / 2;
      ellipse(c, Math.cos(a) * 3.2, -29 + Math.sin(a) * 3.2, 2.6, 2.6);
      c.fill();
    }
    c.fillStyle = '#ffd84a';
    ellipse(c, 0, -29, 2, 2);
    c.fill();

    // 화분
    c.fillStyle = '#b85a2e';
    c.beginPath();
    c.moveTo(-12, 14); c.lineTo(12, 14); c.lineTo(9, 28); c.lineTo(-9, 28);
    c.closePath();
    c.fill();
    c.strokeStyle = '#6e3318';
    c.lineWidth = 1.5;
    c.stroke();
    c.fillStyle = '#d6783f';
    roundRectPath(c, -15, 9, 30, 7, 2);
    c.fill();
    c.stroke();
    c.restore();
  }

  // ---------- 배경 ----------
  const bgStars = Array.from({ length: 45 }, () => ({
    x: Math.random() * W, y: Math.random() * (GROUND - 120), r: Math.random() * 1.4 + 0.4, p: Math.random() * 6
  }));
  let skyGrad = null, groundGrad = null;

  function drawBackground(t) {
    if (!skyGrad) {
      skyGrad = ctx.createLinearGradient(0, 0, 0, H);
      skyGrad.addColorStop(0, '#1c1650');
      skyGrad.addColorStop(0.6, '#3b2d7e');
      skyGrad.addColorStop(1, '#7d5aa6');
      groundGrad = ctx.createLinearGradient(0, GROUND, 0, H);
      groundGrad.addColorStop(0, '#e2ad68');
      groundGrad.addColorStop(1, '#b07a3d');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H);

    for (const s of bgStars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.p);
      ctx.fillStyle = '#fff';
      ellipse(ctx, s.x, s.y, s.r, s.r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 달
    ctx.save();
    ctx.shadowColor = 'rgba(255,240,200,0.7)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#fff3cf';
    ellipse(ctx, 306, 62, 20, 20);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(220,200,150,0.5)';
    ellipse(ctx, 300, 57, 4, 4); ctx.fill();
    ellipse(ctx, 312, 68, 3, 3); ctx.fill();

    // 언덕
    ctx.fillStyle = '#2f2468';
    ellipse(ctx, 50, GROUND + 14, 150, 64); ctx.fill();
    ctx.fillStyle = '#382b78';
    ellipse(ctx, 300, GROUND + 20, 170, 76); ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#f3c886';
    ctx.fillRect(0, GROUND, W, 3);
    ctx.fillStyle = 'rgba(120,70,30,0.35)';
    [[30, 12], [95, 18], [170, 10], [240, 17], [320, 13]].forEach(([x, y]) => {
      ellipse(ctx, x, GROUND + y, 4, 2); ctx.fill();
    });
  }

  // ---------- 게임 진행 ----------
  function spawn() {
    let cactusCount = 0;
    for (const o of items) if (o.type === 'cactus') cactusCount++;
    // 선인장은 별 사이에 가끔만(별 두 개 이상 나온 뒤, 화면에 최대 2개)
    if (sinceCactus >= 2 && cactusCount < 2 && Math.random() < 0.3) {
      sinceCactus = 0;
      items.push({ type: 'cactus', x: rand(30, W - 30), y: -34, vy: rand(70, 95) });
    } else {
      sinceCactus++;
      items.push({ type: 'star', x: rand(24, W - 24), y: -18, vy: rand(115, 150), r: 15, rot: Math.random() * 6, spin: rand(-2, 2) });
    }
    spawnTimer = rand(0.75, 1.05);
  }

  function updatePlayer(dt) {
    const dir = ((input.keyR || input.btnR) ? 1 : 0) - ((input.keyL || input.btnL) ? 1 : 0);
    const prev = player.x;
    if (dir) {
      input.drag = false;
      player.x += dir * SPEED * dt;
    } else if (input.drag) {
      player.x += (input.dragX - player.x) * Math.min(1, dt * 16);
    }
    player.x = clamp(player.x, player.w / 2, W - player.w / 2);
    const dx = player.x - prev;
    player.moving = Math.abs(dx) > 0.2;
    if (player.moving) player.face = dx > 0 ? 1 : -1;
  }

  function updateItems(dt) {
    const top = GROUND - player.h;
    // 코끼리 부딪힘 판정: 그림보다 작은 몸통 상자
    const pw = player.w * 0.6, ph = player.h * 0.55;
    const px1 = player.x - pw / 2, px2 = player.x + pw / 2;
    const py2 = GROUND - 6, py1 = py2 - ph;

    for (let i = items.length - 1; i >= 0; i--) {
      const o = items[i];
      o.y += o.vy * dt;
      if (o.type === 'star') {
        o.rot += o.spin * dt;
        // 넉넉한 받기 판정: 코끼리 폭보다 좌우로 넓고, 머리 위에서도 받아요
        if (o.y + o.r >= top - 14 && o.y - o.r <= GROUND &&
            Math.abs(o.x - player.x) <= player.w / 2 + CATCH_PAD) {
          items.splice(i, 1);
          catchStar(o);
          if (state !== 'playing') return;
          continue;
        }
        if (o.y - o.r > H) items.splice(i, 1);
      } else {
        // 선인장 판정 상자: 줄기 가운데만(그림 폭 약 38 → 16, 높이 약 60 → 40)
        const cx1 = o.x - 8, cx2 = o.x + 8, cy1 = o.y - 24, cy2 = o.y + 16;
        if (invTimer <= 0 && cx1 < px2 && cx2 > px1 && cy1 < py2 && cy2 > py1) {
          items.splice(i, 1);
          hit(o);
          if (state !== 'playing') return;
          continue;
        }
        if (o.y - 34 > H) items.splice(i, 1);
      }
    }
  }

  function catchStar(o) {
    score += STAR_POINTS;
    caught++;
    effects.push({ kind: 'text', x: o.x, y: o.y - 10, text: '+' + STAR_POINTS, color: '#ffe066', t: 0, life: 0.8 });
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * Math.PI * 2, v = rand(60, 160);
      effects.push({ kind: 'p', x: o.x, y: o.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: rand(0.4, 0.7), color: k % 2 ? '#ffe066' : '#fff' });
    }
    updateHud();
    if (score >= GOAL) {
      state = 'clearing';
      waitTimer = 1.0;
      items = [];
    }
  }

  function hit(o) {
    lives--;
    invTimer = INVINCIBLE;
    shake = 0.3;
    hitFlash = 0.35;
    effects.push({ kind: 'text', x: o.x, y: o.y - 20, text: '아야!', color: '#ff8da1', t: 0, life: 0.9 });
    updateHud();
    if (lives <= 0) {
      state = 'dying';
      waitTimer = 0.8;
    }
  }

  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t += dt;
      if (e.kind === 'p') {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        e.vy += 260 * dt;
      } else {
        e.y -= 40 * dt;
      }
      if (e.t >= e.life) effects.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt);
    if (hitFlash > 0) hitFlash = Math.max(0, hitFlash - dt);
  }

  function bigText(text, y, color) {
    ctx.font = '900 46px system-ui, -apple-system, "Malgun Gothic", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#2a1d5e';
    ctx.strokeText(text, W / 2, y);
    ctx.fillStyle = color;
    ctx.fillText(text, W / 2, y);
  }

  function draw() {
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    if (shake > 0) ctx.translate(rand(-4, 4) * shake / 0.3, rand(-4, 4) * shake / 0.3);

    drawBackground(time);
    for (const o of items) {
      if (o.type === 'star') drawStar(ctx, o.x, o.y, o.r, o.rot);
      else drawCactus(ctx, o.x, o.y);
    }
    drawGround();

    // 무적일 때 깜빡이기
    const blink = invTimer > 0 && Math.floor(invTimer * 12) % 2 === 0;
    ctx.globalAlpha = blink ? 0.25 : 1;
    drawElephant(ctx, player.x, GROUND, 1, player.face, time, player.moving);
    ctx.globalAlpha = 1;

    for (const e of effects) {
      const a = 1 - e.t / e.life;
      ctx.globalAlpha = Math.max(0, a);
      if (e.kind === 'p') {
        ctx.fillStyle = e.color;
        ellipse(ctx, e.x, e.y, 2.4, 2.4);
        ctx.fill();
      } else {
        ctx.font = '900 22px system-ui, -apple-system, "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#2a1d5e';
        ctx.strokeText(e.text, e.x, e.y);
        ctx.fillStyle = e.color;
        ctx.fillText(e.text, e.x, e.y);
      }
    }
    ctx.globalAlpha = 1;

    if (hitFlash > 0) {
      ctx.fillStyle = 'rgba(255,60,90,' + (hitFlash * 0.6).toFixed(3) + ')';
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }
    if (state === 'clearing' || state === 'ending') bigText('클리어!', H * 0.4, '#ffe066');
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    time += dt;

    if (state === 'playing') {
      spawnTimer -= dt;
      if (spawnTimer <= 0) spawn();
      updatePlayer(dt);
      if (invTimer > 0) invTimer -= dt;
      updateItems(dt);
    } else if (state === 'clearing' || state === 'dying') {
      if (state === 'clearing') updatePlayer(dt);
      if (invTimer > 0) invTimer -= dt;
      waitTimer -= dt;
      if (waitTimer <= 0) {
        if (state === 'clearing') showEnding();
        else showGameOver();
      }
    }
    updateEffects(dt);
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- 음악 ----------
  let musicAvailable = true;
  let musicWanted = true;

  function updateMusicBtn() {
    if (!musicAvailable) {
      musicBtn.textContent = '음악 없음';
      musicBtn.disabled = true;
      musicBtn.setAttribute('aria-pressed', 'false');
      return;
    }
    musicBtn.disabled = false;
    musicBtn.textContent = musicWanted ? '음악 끄기' : '음악 켜기';
    musicBtn.setAttribute('aria-pressed', musicWanted ? 'true' : 'false');
  }

  function markMusicMissing() {
    musicAvailable = false;
    updateMusicBtn();
  }
  music.addEventListener('error', markMusicMissing);
  if (music.error) markMusicMissing();
  music.volume = 0.6;

  function playMusic() {
    if (!musicAvailable || !musicWanted) return;
    let p;
    try { p = music.play(); } catch (err) { return; }
    if (p && typeof p.catch === 'function') {
      p.catch(err => {
        const name = err && err.name;
        if (name === 'AbortError') return;          // 바로 멈춘 경우
        if (name === 'NotSupportedError' || music.error) { markMusicMissing(); return; }
        musicWanted = false;                         // 자동 재생이 막힘 → 버튼으로 다시 켤 수 있게
        updateMusicBtn();
      });
    }
  }

  musicBtn.addEventListener('click', () => {
    if (!musicAvailable) return;
    musicWanted = !musicWanted;
    if (musicWanted) {
      if (state !== 'ending') playMusic();
    } else {
      music.pause();
    }
    updateMusicBtn();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) music.pause();
    else if (state !== 'start' && state !== 'ending') playMusic();
  });

  // ---------- 시작 화면 그림 ----------
  function showPosterFallback() {
    poster.classList.add('hidden');
    posterCanvas.classList.remove('hidden');
    const size = 320, scale = 2;
    posterCanvas.width = size * scale;
    posterCanvas.height = size * scale;
    const c = posterCanvas.getContext('2d');
    c.setTransform(scale, 0, 0, scale, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, size);
    g.addColorStop(0, '#231a5e');
    g.addColorStop(1, '#6d4fa0');
    c.fillStyle = g;
    c.fillRect(0, 0, size, size);
    for (let i = 0; i < 30; i++) {
      c.fillStyle = 'rgba(255,255,255,' + rand(0.3, 0.8).toFixed(2) + ')';
      ellipse(c, rand(0, size), rand(0, size * 0.6), rand(0.5, 1.6), rand(0.5, 1.6));
      c.fill();
    }
    c.fillStyle = '#e2ad68';
    c.fillRect(0, 262, size, size - 262);
    drawStar(c, 92, 118, 18, 0.2);
    drawStar(c, 238, 96, 14, -0.3);
    drawStar(c, 196, 160, 22, 0.1);
    drawCactus(c, 270, 230);
    drawElephant(c, 140, 262, 1.6, 1, 0, false);
    c.font = '900 34px system-ui, -apple-system, "Malgun Gothic", sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.lineJoin = 'round';
    c.lineWidth = 7;
    c.strokeStyle = '#2a1d5e';
    c.strokeText('코끼리 별 받기', size / 2, 46);
    c.fillStyle = '#ffe066';
    c.fillText('코끼리 별 받기', size / 2, 46);
  }
  poster.addEventListener('error', showPosterFallback);
  if (poster.complete && poster.naturalWidth === 0) showPosterFallback();

  // ---------- 엔딩 영상 ----------
  let videoAvailable = true;

  function showEndPanel() {
    if (state !== 'ending') return;
    skipBtn.classList.add('hidden');
    endPanel.classList.remove('hidden');
    if (!videoAvailable) {
      video.classList.add('hidden');
      endingScreen.classList.add('novideo');
    }
  }

  video.addEventListener('error', () => {
    videoAvailable = false;
    showEndPanel();
  });
  if (video.error) videoAvailable = false;
  video.addEventListener('ended', showEndPanel);

  function tryPlay(media) {
    try {
      const p = media.play();
      return p && typeof p.then === 'function' ? p : Promise.resolve();
    } catch (err) {
      return Promise.reject(err);
    }
  }

  function showEnding() {
    state = 'ending';
    music.pause();
    endingScreen.classList.remove('hidden');
    endPanel.classList.add('hidden');
    if (!videoAvailable) {
      showEndPanel();
      return;
    }
    endingScreen.classList.remove('novideo');
    video.classList.remove('hidden');
    skipBtn.classList.remove('hidden');
    try { video.currentTime = 0; } catch (err) { /* 무시 */ }
    video.muted = false;
    tryPlay(video)
      .catch(err => {
        if (err && err.name === 'NotAllowedError') {   // 소리 때문에 막히면 소리 없이 한 번 더
          video.muted = true;
          return tryPlay(video);
        }
        throw err;
      })
      .catch(() => {
        if (video.error) videoAvailable = false;
        showEndPanel();
      });
  }

  skipBtn.addEventListener('click', () => {
    video.pause();
    showEndPanel();
  });

  function showGameOver() {
    state = 'over';
    $('overText').textContent = '점수 ' + score + '점 (별 ' + caught + '개)';
    overScreen.classList.remove('hidden');
  }

  // ---------- 시작·다시 하기 ----------
  function startGame() {
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    endingScreen.classList.add('hidden');
    video.pause();
    reset();
    state = 'playing';
    playMusic();
    fit();
  }
  $('startBtn').addEventListener('click', startGame);
  $('retryBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);

  // ---------- 조작: 키보드 ----------
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'Left') { input.keyL = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'Right') { input.keyR = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'Left') input.keyL = false;
    else if (e.key === 'ArrowRight' || e.key === 'Right') input.keyR = false;
  });
  window.addEventListener('blur', () => {
    input.keyL = input.keyR = input.btnL = input.btnR = input.drag = false;
    $('leftBtn').classList.remove('on');
    $('rightBtn').classList.remove('on');
  });

  // ---------- 조작: 누르고 있는 버튼 ----------
  function bindHold(btn, key) {
    const on = e => {
      e.preventDefault();
      input[key] = true;
      btn.classList.add('on');
      try { btn.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    };
    const off = () => {
      input[key] = false;
      btn.classList.remove('on');
    };
    btn.addEventListener('pointerdown', on);
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('lostpointercapture', off);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindHold($('leftBtn'), 'btnL');
  bindHold($('rightBtn'), 'btnR');

  // ---------- 조작: 화면 끌기 ----------
  function toGameX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  canvas.addEventListener('pointerdown', e => {
    if (state !== 'playing' && state !== 'clearing') return;
    e.preventDefault();
    input.drag = true;
    input.dragX = toGameX(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
  });
  canvas.addEventListener('pointermove', e => {
    if (input.drag) input.dragX = toGameX(e);
  });
  const endDrag = () => { input.drag = false; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('lostpointercapture', endDrag);

  // ---------- 출발 ----------
  reset();
  updateMusicBtn();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
